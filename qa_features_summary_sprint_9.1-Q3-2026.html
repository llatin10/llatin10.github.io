<!doctype html><html lang="en"><head><meta charset="utf-8"><title>QA Features Summary — Sprint 9.1-Q3-2026 Bugs</title><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style></head><body><link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&family=Noto+Sans+Hebrew:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Layout: one column. Header (sprint + compare + theme) > key findings > sticky tab bar with live count and chips > tab panels.
   Overview = B's overview strip > A's chart grid > shared filter area > B's feature cards or A's table. Matrix = C. Trends = small multiples.
   Palette = design B: teal ease ramp, iOS blue / Android orange, feature dark grey / outside light grey. */
:root{
  --bg:#f5f6f3;--surface:#ffffff;--surface-2:#eef1ec;--ink:#1d2622;--ink-2:#434f49;--ink-3:#57635d;--line:#d3dad3;--line-strong:#8f9b94;
  --accent:#0f766e;--accent-ink:#ffffff;--accent-soft:#dcefeb;
  --pass:#1b6e38;--pass-soft:#e1f2e6;--warn:#7f4a06;--warn-soft:#fbeed7;--fail:#b3261e;--fail-soft:#f9e1de;--na:#4f5b55;--na-soft:#e6e9e6;
  --ease-1:#0d5c55;--ease-2:#2c8f84;--ease-3:#72b8ad;--ease-1-ink:#ffffff;--ease-2-ink:#0b1512;--ease-3-ink:#0b1512;
  --ios:#2a78d6;--android:#eb6834;--plat-3:#b0457a;--slate:#34465b;--slate-soft:#e3e9f0;
  --fw:#4a5650;--nfw:#b9c2bc;--bar:#4a5650;
  --rej-fill:#4a5650;--racc-fill:#9aa59f;--ghost:#57635d;
  --seq-lo:#e4f1ed;--seq-hi:#0d5c55;--seq-ink-hi:#ffffff;--seq-flip:.6;--seq-floor:.82;
  --grid:#e3e8e3;--weekend:rgba(29,38,34,.05);--scrim:rgba(16,22,20,.34);--pop-shadow:0 14px 44px rgba(16,22,20,.2);
  --focus:#0f766e;--shadow:0 1px 2px rgba(29,38,34,.05),0 4px 16px rgba(29,38,34,.05);
  --radius:12px;
  --font:"IBM Plex Sans","Noto Sans Hebrew",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono","Noto Sans Hebrew",ui-monospace,SFMono-Regular,Menlo,monospace;
  color-scheme:light}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#101614;--surface:#172019;--surface-2:#1e2a24;--ink:#e6ece8;--ink-2:#bfcac4;--ink-3:#9aa7a0;--line:#2f3f37;--line-strong:#6b7a72;
  --accent:#4fb8a9;--accent-ink:#0b1512;--accent-soft:#16332e;
  --pass:#6fcf8f;--pass-soft:#16301f;--warn:#e8b35c;--warn-soft:#33270f;--fail:#f08a80;--fail-soft:#3a1a17;--na:#a9b5ae;--na-soft:#26302b;
  --ease-1:#a6e3d8;--ease-2:#4fb8a9;--ease-3:#2c7f74;--ease-1-ink:#0b1512;--ease-2-ink:#0b1512;--ease-3-ink:#ffffff;
  --ios:#3987e5;--android:#d95926;--plat-3:#d36aa6;--slate:#b9c7d8;--slate-soft:#232c37;
  --fw:#b4c0b9;--nfw:#4d5d55;--bar:#b4c0b9;
  --rej-fill:#b4c0b9;--racc-fill:#6b7a72;--ghost:#9aa7a0;
  --seq-lo:#1b3a33;--seq-hi:#86d9cb;--seq-ink-hi:#0b1512;--seq-flip:.35;--seq-floor:.62;
  --grid:#24312b;--weekend:rgba(230,236,232,.04);--scrim:rgba(0,0,0,.55);--pop-shadow:0 14px 44px rgba(0,0,0,.55);
  --focus:#7fd3c6;--shadow:none;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#101614;--surface:#172019;--surface-2:#1e2a24;--ink:#e6ece8;--ink-2:#bfcac4;--ink-3:#9aa7a0;--line:#2f3f37;--line-strong:#6b7a72;
  --accent:#4fb8a9;--accent-ink:#0b1512;--accent-soft:#16332e;
  --pass:#6fcf8f;--pass-soft:#16301f;--warn:#e8b35c;--warn-soft:#33270f;--fail:#f08a80;--fail-soft:#3a1a17;--na:#a9b5ae;--na-soft:#26302b;
  --ease-1:#a6e3d8;--ease-2:#4fb8a9;--ease-3:#2c7f74;--ease-1-ink:#0b1512;--ease-2-ink:#0b1512;--ease-3-ink:#ffffff;
  --ios:#3987e5;--android:#d95926;--plat-3:#d36aa6;--slate:#b9c7d8;--slate-soft:#232c37;
  --fw:#b4c0b9;--nfw:#4d5d55;--bar:#b4c0b9;
  --rej-fill:#b4c0b9;--racc-fill:#6b7a72;--ghost:#9aa7a0;
  --seq-lo:#1b3a33;--seq-hi:#86d9cb;--seq-ink-hi:#0b1512;--seq-flip:.35;--seq-floor:.62;
  --grid:#24312b;--weekend:rgba(230,236,232,.04);--scrim:rgba(0,0,0,.55);--pop-shadow:0 14px 44px rgba(0,0,0,.55);
  --focus:#7fd3c6;--shadow:none;color-scheme:dark}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:17px;line-height:1.55;overflow-x:hidden}
a{color:var(--accent);text-underline-offset:2px}
a:hover{text-decoration-thickness:2px}
button,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px;border-radius:6px}
[hidden]{display:none!important}
.mono,code,.key,.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.wrap{max-width:1180px;margin:0 auto;padding-inline:16px}
@media (min-width:700px){.wrap{padding-inline:24px}}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.muted{color:var(--ink-3)}
.small{font-size:15px}
bdi{unicode-bidi:isolate}

/* ---------- header ---------- */
header.top{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:16px 28px;padding-block:28px 14px}
.top-main{min-width:0;flex:1 1 360px}
.eyebrow{font:500 14px/1.2 var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);margin:0 0 8px}
h1{font-size:clamp(28px,4.2vw,38px);line-height:1.15;margin:0 0 10px;font-weight:600;letter-spacing:-.01em;text-wrap:balance;display:flex;flex-wrap:wrap;align-items:center;gap:6px 12px}
.meta{display:flex;flex-wrap:wrap;gap:4px 18px;color:var(--ink-2);font-size:16px;margin:0}
.meta b{font-weight:600;color:var(--ink)}
.top-ctrls{display:flex;flex-wrap:wrap;gap:12px 14px;align-items:flex-end}
.badge-prev{display:inline-flex;align-items:center;font:600 13px/1 var(--mono);letter-spacing:.04em;text-transform:uppercase;color:var(--warn);background:var(--warn-soft);border:1px dashed var(--warn);border-radius:6px;padding:5px 8px;white-space:nowrap;vertical-align:middle}
.badge-prev.sm{font-size:12px;padding:3px 6px}
h1 .badge-prev{font-size:14px}

/* ---------- findings ---------- */
.findings{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px 20px;box-shadow:var(--shadow);margin:6px 0 18px}
.findings h2{font-size:15px;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-3);margin:0 0 8px;font-weight:600}
.findings ul{margin:0;padding-left:22px}
.findings li{margin:6px 0;max-width:86ch}
.findings .num{font-family:var(--font);font-weight:600}
.findings .scope{font-size:15px;color:var(--ink-3);margin:10px 0 0}

/* ---------- sticky tab bar ---------- */
.tabbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--bg);border-bottom:1px solid var(--line);display:flex;flex-wrap:wrap;align-items:center;gap:8px 16px;padding-block:8px}
[role="tablist"]{display:flex;gap:6px;flex-wrap:wrap}
[role="tab"]{min-height:48px;padding:8px 20px;border:1px solid var(--line);background:var(--surface);border-radius:10px;font-size:18px;font-weight:600;color:var(--ink-2);cursor:pointer}
[role="tab"]:hover{border-color:var(--line-strong);color:var(--ink)}
[role="tab"][aria-selected="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.tb-status{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;flex:1 1 280px;min-width:0}
.count{font:500 16px var(--mono);color:var(--ink-2);white-space:nowrap}
.count b{color:var(--ink);font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips:empty{display:none}
.chip{display:inline-flex;align-items:center;gap:8px;min-height:40px;border:1px solid var(--accent);background:var(--accent-soft);color:var(--ink);border-radius:999px;padding:4px 8px 4px 14px;font-size:15px;cursor:pointer;max-width:100%}
.chip .x{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:50%;font-size:18px;line-height:1;color:var(--ink-2)}
.chip:hover .x{background:var(--surface);color:var(--ink)}
.linkbtn{border:0;background:none;color:var(--accent);cursor:pointer;font-size:16px;font-weight:500;padding:8px 6px;min-height:44px;text-decoration:underline;text-underline-offset:3px}
@media (max-width:640px){.tabbar .chips{display:none}[role="tab"]{padding:8px 14px;font-size:17px}}

/* ---------- buttons / controls ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;border:1px solid var(--line-strong);background:var(--surface);border-radius:10px;padding:8px 16px;font-size:16px;font-weight:500;cursor:pointer;color:var(--ink)}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.danger{background:var(--fail);border-color:var(--fail);color:var(--surface)}
.btn.ghost{background:transparent;border-color:var(--line)}
.btn[disabled]{opacity:.5;cursor:default}
.f-lbl{display:block;font-size:15px;font-weight:600;color:var(--ink-2);margin:0 0 6px}
.seg-wrap{min-width:0}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg-b{display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:8px 14px;border:1px solid var(--line-strong);background:var(--surface);border-radius:10px;font-size:17px;cursor:pointer;color:var(--ink);text-align:left}
.seg-b:hover{background:var(--surface-2)}
.seg-b[aria-checked="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.seg-b[aria-checked="true"] .seg-n{background:var(--accent-ink);color:var(--accent)}
.seg-b.zero{color:var(--ink-3);border-style:dashed}
.compact .seg-b{font-size:16px;padding:8px 12px}
.seg-n{display:inline-block;min-width:26px;text-align:center;font:600 14px/1.5 var(--mono);background:var(--surface-2);color:var(--ink);border-radius:999px;padding:0 7px}
.sw{display:inline-block;width:12px;height:12px;border-radius:3px;background:var(--c);flex:none}
.sw.round{border-radius:50%}
.tg{display:inline-flex;align-items:center;gap:10px;min-height:44px;padding:8px 14px;border:1px solid var(--line-strong);background:var(--surface);border-radius:10px;font-size:17px;cursor:pointer}
.tg:hover{background:var(--surface-2)}
.tg-box{width:20px;height:20px;border:2px solid var(--ink-2);border-radius:5px;display:inline-grid;place-items:center;flex:none}
.tg[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);font-weight:600}
.tg[aria-pressed="true"] .tg-box{background:var(--accent);border-color:var(--accent)}
.tg[aria-pressed="true"] .tg-box::after{content:"";width:6px;height:11px;border:solid var(--accent-ink);border-width:0 3px 3px 0;transform:translateY(-1px) rotate(45deg)}

/* listbox popover */
.lb{position:relative;min-width:0}
.lb.wide{flex:1 1 280px}
.lb-btn{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;min-width:200px;min-height:48px;padding:8px 14px;border:1px solid var(--line-strong);background:var(--surface);border-radius:10px;font-size:18px;cursor:pointer;text-align:left}
.lb-btn:hover{background:var(--surface-2)}
.lb-btn[aria-expanded="true"]{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset}
.lb-cur{display:flex;align-items:center;gap:8px;min-width:0;flex-wrap:wrap}
.lb-t{font-weight:600}
.lb-chev{font-size:16px;color:var(--ink-2)}
.lb-pop{position:absolute;z-index:45;left:0;top:calc(100% + 6px);min-width:100%;width:max-content;max-width:min(520px,calc(100vw - 32px));max-height:min(420px,60vh);overflow:auto;margin:0;padding:6px;list-style:none;background:var(--surface);border:1px solid var(--line-strong);border-radius:12px;box-shadow:var(--pop-shadow)}
.lb-pop:focus{outline:3px solid var(--focus);outline-offset:2px}
.lb-opt{display:flex;align-items:center;gap:10px;min-height:48px;padding:8px 12px;border-radius:8px;font-size:18px;cursor:pointer;color:var(--ink)}
.lb-opt.active{background:var(--accent-soft);box-shadow:inset 0 0 0 2px var(--accent)}
.lb-opt[aria-selected="true"]{font-weight:600}
.lb-ck{width:20px;color:var(--accent);font-weight:700;flex:none}
.lb-ot{display:flex;flex-direction:column;min-width:0;flex:1}
.lb-sub{font-size:15px;color:var(--ink-3);font-weight:400}
@media (max-width:520px){.lb-pop{position:fixed;left:16px;right:16px;top:auto;bottom:16px;width:auto;max-width:none}}
.top-ctrls .lb-btn{min-width:180px}

/* ---------- filter area ---------- */
.filters{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px;margin:22px 0;box-shadow:var(--shadow)}
.f-head{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:4px 16px;margin-bottom:10px}
.f-head h2{font-size:20px;margin:0;font-weight:600}
.f-note{margin:0;font-size:15px;color:var(--ink-3)}
.f-search{margin-bottom:14px}
.f-search input{width:100%;min-height:48px;font-size:18px;color:var(--ink);background:var(--surface);border:1px solid var(--line-strong);border-radius:10px;padding:8px 14px}
.f-search input::placeholder{color:var(--ink-3)}
.f-groups{display:flex;flex-direction:column;gap:14px}
.f-row{display:flex;flex-wrap:wrap;gap:14px 22px;align-items:flex-end}
.f-toggles{gap:8px}
.more-btn{align-self:flex-start;display:inline-flex;align-items:center;gap:10px;min-height:44px;border:1px solid var(--line-strong);background:var(--surface-2);border-radius:10px;padding:8px 16px;font-size:17px;font-weight:600;cursor:pointer}
.f-more{display:flex;flex-direction:column;gap:14px;padding-top:4px;border-top:1px solid var(--line)}
.f-foot{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;margin-top:14px;padding-top:12px;border-top:1px solid var(--line);font-size:16px}
.f-foot .fc b{font-family:var(--mono)}

/* ---------- overview strip (B) ---------- */
.strip{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,230px),1fr));gap:12px;margin:18px 0 8px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;box-shadow:var(--shadow);min-width:0;display:flex;flex-direction:column;gap:2px}
button.tile{text-align:left;cursor:pointer;width:100%;border-width:1px}
button.tile:hover{background:var(--surface-2);border-color:var(--line-strong)}
button.tile[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent) inset;background:var(--accent-soft)}
.tile .lbl{font-size:16px;color:var(--ink-2);margin:0;font-weight:500}
.tile .val{font-size:34px;font-weight:600;line-height:1.15;font-variant-numeric:tabular-nums}
.tile .val small{font-size:16px;font-weight:400;color:var(--ink-3);margin-left:6px}
.tile .sub{font-size:15px;color:var(--ink-2);margin-top:4px}
.delta{display:flex;flex-wrap:wrap;align-items:baseline;gap:2px 8px;font:600 15px/1.4 var(--mono);font-variant-numeric:tabular-nums}
.delta.bad{color:var(--fail)}.delta.good{color:var(--pass)}.delta.neu{color:var(--ink-2)}
.delta-vs{font-weight:400;color:var(--ink-3);font-size:14px}
.bar{display:flex;gap:2px;height:28px;align-items:center;margin:10px 0 6px}
.bar .bseg{height:28px;display:flex;align-items:center;cursor:pointer;min-width:0}
.bar .bseg i{display:block;height:12px;width:100%;background:var(--c)}
.bar .bseg:first-child i{border-radius:4px 0 0 4px}
.bar .bseg:last-child i{border-radius:0 4px 4px 0}
.bar .bseg:first-child:last-child i{border-radius:4px}
.bar.dim .bseg i{opacity:.35}
.bar.dim .bseg.on i{opacity:1}
.bar.empty::before{content:"";display:block;height:12px;width:100%;border-radius:4px;background:var(--surface-2)}
.legend{display:flex;flex-wrap:wrap;gap:4px 6px;margin:0;padding:0;list-style:none}
.lg{display:inline-flex;align-items:center;gap:7px;min-height:40px;border:1px solid transparent;background:none;border-radius:999px;padding:4px 10px 4px 8px;font-size:15px;color:var(--ink-2);cursor:pointer;line-height:1.3}
.lg:hover{background:var(--surface-2);border-color:var(--line)}
.lg[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);color:var(--ink);font-weight:600}
.lg .sw{width:12px;height:12px}
.lg .n{font-family:var(--mono);color:var(--ink);font-weight:600}
.lg[disabled]{opacity:.5;cursor:default}
.row-legend{margin:0 0 10px}

/* ---------- chart grid (A in B palette) ---------- */
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:8px 16px;flex-wrap:wrap;margin:26px 0 12px}
.sec-h h2{font-size:22px;margin:0;font-weight:600}
.hint{font-size:15px;color:var(--ink-3)}
.ghost-key{display:inline-flex;align-items:center;gap:8px;font-size:15px;color:var(--ink-2);flex-wrap:wrap}
.ghost-sw{display:inline-block;width:28px;height:16px;border:1.5px dashed var(--ghost);border-radius:4px}
.grid{display:grid;grid-template-columns:minmax(0,1fr);gap:14px}
@media (min-width:900px){.grid{grid-template-columns:minmax(0,1.25fr) minmax(0,1fr)}.c-c1{grid-row:span 2}}
.rej-sec{margin:26px 0 0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px;box-shadow:var(--shadow);min-width:0}
.card-h{display:flex;justify-content:space-between;align-items:baseline;gap:6px 14px;flex-wrap:wrap;margin-bottom:4px}
.card h3,.card-h h2{font-size:19px;margin:0;font-weight:600}
.cap{font:500 15px/1.3 var(--mono);color:var(--ink-3);font-variant-numeric:tabular-nums}
.desc{font-size:15px;color:var(--ink-3);margin:2px 0 12px;max-width:80ch}
.chart{width:100%;min-height:40px}
.chart svg,.tchart svg{display:block;overflow:visible;max-width:100%}
.rlabel{font-size:15px;fill:var(--ink);font-family:var(--font)}
.tipv{font:600 15px var(--mono);fill:var(--ink)}
.tipp{font:400 14px var(--mono);fill:var(--ink-3)}
.inl{font:600 14px var(--mono);pointer-events:none}
.base{stroke:var(--line-strong);stroke-width:1}
.ghost{fill:none;stroke:var(--ghost);stroke-width:1.5;stroke-dasharray:4 3}
.f-e1{fill:var(--ease-1)}.f-e2{fill:var(--ease-2)}.f-e3{fill:var(--ease-3)}.f-bar{fill:var(--bar)}
.t-e1{fill:var(--ease-1-ink)}.t-e2{fill:var(--ease-2-ink)}.t-e3{fill:var(--ease-3-ink)}
.f-rej{fill:var(--rej-fill)}.f-racc{fill:var(--racc-fill)}.f-over{fill:var(--surface);stroke:var(--ink-2);stroke-width:1.5;stroke-dasharray:3 2}
.sw.sw-f-rej{background:var(--rej-fill)}.sw.sw-f-racc{background:var(--racc-fill)}.sw.sw-f-over{background:var(--surface);border:1.5px dashed var(--ink-2)}.sw.sw-f-bar{background:var(--bar)}
.hitbox{fill:transparent}
.hit{cursor:pointer;outline:none}
.hit:hover .mark{opacity:.82}
.hit:focus-visible .hitbox{stroke:var(--focus);stroke-width:3}
.rowhit:hover .rlabel{text-decoration:underline}
.rowhit.on .rlabel{font-weight:600}
.dim{opacity:.3}
.rej-wrap{display:grid;grid-template-columns:minmax(0,1fr);gap:18px}
@media (min-width:900px){.rej-wrap{grid-template-columns:minmax(300px,.85fr) minmax(0,1.3fr)}}
.rej-list{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.rej-list li{border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--surface-2);min-width:0}
.rej-top{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;font-size:15px}
.rej-why{margin:6px 0 2px}
.rej-title{font-size:15px}
.rej-path{margin-top:6px}
.empty{color:var(--ink-3);padding:8px 0}

/* pills + badges */
.pill{display:inline-block;font-size:14px;font-weight:500;border-radius:999px;padding:1px 10px;line-height:1.6;white-space:nowrap;border:1px solid transparent}
.pill.open{background:var(--warn-soft);color:var(--warn)}
.pill.closed{background:var(--pass-soft);color:var(--pass)}
.pill.rejected{background:var(--fail-soft);color:var(--fail)}
.pill.racc{background:var(--na-soft);color:var(--na);border-color:var(--line)}
.pill.overturned{background:transparent;color:var(--ink-2);border:1.5px dashed var(--ink-2)}
.pill.ax{background:var(--accent-soft);color:var(--accent);border-color:var(--accent)}
.pill.reopen{background:var(--warn-soft);color:var(--warn);border:1.5px solid var(--warn);font-weight:600}
.pill.carried{background:var(--slate-soft);color:var(--slate);border:1.5px solid var(--slate);font-weight:600}
.pill.nmb{background:var(--na-soft);color:var(--na);border:1.5px dashed var(--na)}
.pill.edited{background:var(--surface);color:var(--accent);border:1.5px solid var(--accent);font-weight:600}
.plat{display:inline-flex;align-items:center;gap:6px;font-size:15px;color:var(--ink-2);white-space:nowrap}
.plat .dot{width:10px;height:10px;border-radius:50%;background:var(--c);flex:none}
.ease{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:6px;font:600 14px var(--mono)}
.ease.e1{background:var(--ease-1);color:var(--ease-1-ink)}.ease.e2{background:var(--ease-2);color:var(--ease-2-ink)}.ease.e3{background:var(--ease-3);color:var(--ease-3-ink)}
.steps{display:flex;flex-wrap:wrap;align-items:center;gap:4px 6px}
.step{display:inline-flex;align-items:baseline;gap:5px;border-radius:6px;padding:2px 8px;font-size:14px;border:1px solid var(--line);background:var(--surface);color:var(--ink-2);white-space:nowrap}
.step .sm{font-family:var(--mono);font-size:13px;color:var(--ink-3)}
.step.k-warn{background:var(--warn-soft);border-color:transparent;color:var(--warn)}
.step.k-closed{background:var(--na-soft);border-color:var(--na);color:var(--ink)}
.step.k-fail{background:var(--fail-soft);border-color:var(--fail);color:var(--fail)}
.step.k-pass{background:var(--pass-soft);border-color:transparent;color:var(--pass)}
.arrow{color:var(--ink-3);font-size:13px}

/* ---------- feature cards (B) ---------- */
.index-wrap{margin:0 0 18px}
.index-label{font-size:15px;color:var(--ink-3);margin:0 0 6px}
.index{display:flex;flex-wrap:wrap;gap:6px;margin:0;padding:0;list-style:none}
.index a{display:inline-flex;gap:8px;align-items:center;min-height:44px;text-decoration:none;color:var(--ink-2);border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 14px;font-size:16px}
.index a:hover{color:var(--ink);background:var(--surface-2)}
.index .n{font-family:var(--mono);color:var(--ink);font-weight:600}
.fcard{padding:0;overflow:hidden;margin:0 0 22px;scroll-margin-top:80px}
.card-head{padding:20px 22px 16px;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,320px);gap:14px 28px}
.card-kicker{font-size:14px;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-3);margin:0 0 4px;font-weight:600}
.fcard h2{font-size:26px;line-height:1.25;margin:0 0 6px;font-weight:600}
.stories{font-size:15px;color:var(--ink-3);display:flex;flex-wrap:wrap;gap:4px 10px;align-items:center}
.stories a{font-family:var(--mono);font-size:15px}
.also{display:flex;flex-wrap:wrap;align-items:center;gap:4px 6px;margin:8px 0 0;font-size:16px;color:var(--ink-2)}
.also b{font-family:var(--mono)}
.bigcount{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:12px 0 4px}
.bigcount .num{font-size:38px;font-weight:600;font-family:var(--font);line-height:1}
.bigcount .of{font-size:16px;color:var(--ink-3)}
.takeaway{font-size:18px;line-height:1.5;margin:12px 0 0;max-width:64ch;padding-left:14px;border-left:3px solid var(--accent)}
.side .side-lbl{font-size:15px;color:var(--ink-3);margin:2px 0 0}
.chiprow{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.stat{display:inline-flex;align-items:center;gap:8px;min-height:40px;border:1px solid var(--line);background:var(--surface-2);border-radius:999px;padding:4px 12px;font-size:15px;color:var(--ink-2);cursor:pointer}
.stat:hover{border-color:var(--line-strong)}
.stat .n{font-family:var(--mono);font-weight:600;color:var(--ink)}
.stat[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);color:var(--ink)}
.stat[disabled]{cursor:default;opacity:.55}
.origins{margin-top:10px}
.buglist{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
.group-h{padding:14px 22px 6px;font-size:16px;font-weight:600;color:var(--ink-2);background:var(--surface-2);border-top:1px solid var(--line);display:flex;gap:8px;align-items:baseline}
.group-h .num{color:var(--ink-3);font-weight:500}
.group-h:first-child{border-top:0}
.bug{border-top:1px solid var(--line)}
.bug:first-child{border-top:0}
.bug.is-edited{box-shadow:inset 4px 0 0 var(--accent)}
.bug-line{display:grid;grid-template-columns:116px minmax(0,1fr);align-items:start;gap:0 4px;padding:0 14px 0 22px}
.bug-line .key{font-size:15px;font-weight:500;padding:14px 0;white-space:nowrap}
.bug-toggle{display:grid;grid-template-columns:minmax(0,300px) minmax(0,1fr) 20px;gap:12px;align-items:start;text-align:left;border:0;background:none;padding:10px 6px;cursor:pointer;border-radius:8px;width:100%;min-width:0;min-height:48px}
.bug-toggle:hover{background:var(--surface-2)}
.tags{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.title{font-size:17px;line-height:1.5;min-width:0;overflow-wrap:anywhere;unicode-bidi:plaintext}
.chev{color:var(--ink-3);font-size:13px;padding-top:6px;transition:transform .15s}
.bug-toggle[aria-expanded="true"] .chev{transform:rotate(90deg)}
.bug-detail{padding:4px 22px 20px 138px}
.empty-all{background:var(--surface);border:1px dashed var(--line-strong);border-radius:var(--radius);padding:28px;text-align:center;color:var(--ink-2)}

/* bug detail + edit */
.detail-body{display:grid;gap:14px;min-width:0}
.dgrid{display:grid;grid-template-columns:160px minmax(0,1fr);gap:8px 16px;margin:0;font-size:16px;max-width:980px}
.dgrid dt{color:var(--ink-3);font-size:15px;padding-top:2px}
.dgrid dd{margin:0;min-width:0;overflow-wrap:anywhere}
.dgrid .sum{font-weight:500}
.was{display:inline-block;margin-left:6px;font-size:15px;color:var(--accent);font-weight:500}
.edit-area{display:flex;flex-wrap:wrap;align-items:center;gap:10px}
.edit{width:100%;max-width:820px;display:flex;flex-direction:column;gap:16px;border:2px solid var(--accent);border-radius:var(--radius);padding:16px 18px;background:var(--surface)}
.edit h4{margin:0;font-size:19px}
.ed-help{margin:-8px 0 0;font-size:15px;color:var(--ink-3)}
.ed-field{display:flex;flex-direction:column}
.ed-text,.ed-input{width:100%;font-size:17px;line-height:1.45;color:var(--ink);background:var(--surface);border:1px solid var(--line-strong);border-radius:10px;padding:10px 12px;min-height:48px;resize:vertical}
.ed-actions{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.ed-confirm{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:6px 10px;border:1px solid var(--fail);border-radius:10px;background:var(--fail-soft)}
.ed-msg{margin:0;font-size:16px;font-weight:500;padding:8px 12px;border-radius:8px}
.ed-msg.ok{background:var(--pass-soft);color:var(--pass)}
.ed-msg.err{background:var(--fail-soft);color:var(--fail)}

/* ---------- table (A in B palette) ---------- */
.tbl-box{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
.tbl{border-collapse:collapse;width:100%;min-width:980px;font-size:16px}
.tbl thead th{background:var(--surface-2);text-align:left;font-weight:600;font-size:15px;color:var(--ink-2);border-bottom:1px solid var(--line);padding:0;white-space:nowrap}
.tbl thead th button{all:unset;box-sizing:border-box;display:flex;align-items:center;gap:6px;width:100%;min-height:48px;padding:8px 12px;cursor:pointer}
.tbl thead th button:focus-visible{outline:3px solid var(--focus);outline-offset:-3px}
.tbl .arr{font-size:12px;color:var(--ink-3);width:12px}
.tbl tr.row{cursor:pointer;border-top:1px solid var(--line)}
.tbl tr.row:hover,.tbl tr.row.open{background:var(--surface-2)}
.tbl tr.is-edited td:first-child{box-shadow:inset 4px 0 0 var(--accent)}
.tbl td{padding:10px 12px;vertical-align:top}
.tbl td.k{white-space:nowrap}
.exp{display:inline-grid;place-items:center;width:36px;height:36px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink-2);margin-right:8px;cursor:pointer;vertical-align:middle;transition:transform .15s}
tr.open .exp{transform:rotate(90deg)}
.tbl td.t{min-width:320px}
.tbl tr.detail td{padding:6px 14px 18px 56px;background:var(--surface-2)}
.tbl-empty{padding:22px;color:var(--ink-3)}
.ttbl{min-width:560px}
.ttbl th,.ttbl td{padding:10px 12px;text-align:left;border-top:1px solid var(--line);font-variant-numeric:tabular-nums}
.ttbl tbody th{font-weight:600}
.ttbl tr.cur{background:var(--accent-soft)}

/* ---------- matrix (C) ---------- */
.mx-wrap{display:flex;flex-direction:column;gap:16px}
.mx-layout{display:grid;grid-template-columns:minmax(0,1fr) 280px;gap:22px;align-items:start}
.scroll-x{overflow-x:auto;max-width:100%}
table.mx{border-collapse:separate;border-spacing:3px;width:100%;min-width:460px;font-size:16px}
.mx th,.mx td{padding:0;font-weight:400}
.mx thead th{font-size:14px;color:var(--ink-2);text-align:center;vertical-align:bottom;padding-bottom:4px}
.mx thead th.rowh{text-align:left}
.mx .tot-h{text-align:left;padding-left:8px}
.colbtn{border:1px solid transparent;background:none;cursor:pointer;border-radius:8px;padding:4px;width:100%;min-height:52px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;line-height:1.2}
.colbtn:hover{border-color:var(--line);background:var(--surface-2)}
.colbtn[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.colbtn .e{display:inline-flex;align-items:center;gap:6px;font:600 15px var(--mono);color:var(--ink)}
.colbtn .d{color:var(--ink-3);font-size:14px}
.rowbtn{border:1px solid transparent;background:none;cursor:pointer;border-radius:8px;padding:6px 8px;width:100%;min-height:44px;text-align:left;font-size:16px;line-height:1.25;display:block}
.rowbtn:hover{background:var(--surface-2)}
.rowbtn[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.mx td.rowh{width:38%;min-width:150px}
.mx tr.grp th{text-align:left;font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-3);font-weight:600;padding:12px 6px 3px}
.mx tr.grp.sep th{border-top:1px dashed var(--line-strong)}
.mx tr.grp.first th{padding-top:2px}
.cell{display:grid;place-items:center;width:100%;height:44px;min-width:56px;border:0;border-radius:8px;cursor:pointer;font:500 16px var(--mono);font-variant-numeric:tabular-nums}
.cell:hover{box-shadow:inset 0 0 0 2px var(--ink)}
.cell.zero{background:var(--surface-2);color:var(--ink-3);cursor:default;font-weight:400}
.cell.zero:hover{box-shadow:none}
.cell.sel{box-shadow:inset 0 0 0 3px var(--ink)}
.cell.dim{opacity:.35}
.dcell.up{background:var(--fail-soft);color:var(--fail);font-weight:600;box-shadow:inset 0 0 0 1px var(--fail)}
.dcell.down{background:var(--pass-soft);color:var(--pass);font-weight:600;box-shadow:inset 0 0 0 1px var(--pass)}
.dcell.same{background:var(--surface-2);color:var(--ink-3)}
.dkey{display:inline-grid;place-items:center;min-width:34px;height:26px;border-radius:6px;font:600 14px var(--mono)}
.dkey.up{background:var(--fail-soft);color:var(--fail);box-shadow:inset 0 0 0 1px var(--fail)}
.dkey.down{background:var(--pass-soft);color:var(--pass);box-shadow:inset 0 0 0 1px var(--pass)}
.dkey.same{background:var(--surface-2);color:var(--ink-3)}
.tot{display:flex;align-items:center;gap:8px;padding:0 4px 0 8px;min-width:130px}
.tot .num{font-weight:600;font-size:16px;min-width:26px;text-align:right}
.tot .mini{flex:1;height:5px;background:var(--surface-2);border-radius:3px;min-width:24px;position:relative}
.tot .mini i{position:absolute;left:0;top:0;bottom:0;background:var(--ink-3);border-radius:0 3px 3px 0}
.marks{display:inline-flex;gap:8px;font:14px var(--mono);color:var(--ink-2)}
.marks>span{display:inline-flex;align-items:center;gap:3px}
.ic-a11y{display:inline-block;width:10px;height:10px;background:var(--ink-2);transform:rotate(45deg);margin:0 3px}
.ic-rej,.ic-rejring{display:inline-block;width:12px;height:12px;border:2px solid var(--fail);border-radius:50%}
.ic-ghost{display:inline-block;width:11px;height:11px;border:1.5px solid var(--ink-3);border-radius:50%}
.ic-we{display:inline-block;width:16px;height:13px;background:var(--weekend);border:1px solid var(--line-strong)}
.mx tfoot td{padding-top:6px}
.mx tfoot .lab{font-size:13px;color:var(--ink-3);padding-left:8px;text-transform:uppercase;letter-spacing:.06em;font-weight:600}
.mx tfoot .ct{text-align:center;font:600 16px var(--mono);border-top:1px solid var(--line);padding-top:6px}
.mx tr.dimrow .rowbtn{color:var(--ink-3)}
.legend-box{font-size:15px;color:var(--ink-2);display:flex;flex-direction:column;gap:14px}
.legend-box h3{margin:0 0 4px;font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-3)}
.ease-def{display:grid;grid-template-columns:auto 1fr;gap:6px 10px;align-items:start;margin:0}
.ease-def dt{display:flex;align-items:center;gap:6px;font:600 14px var(--mono);color:var(--ink);white-space:nowrap}
.ease-def dd{margin:0;line-height:1.4}
.ramp{height:12px;border-radius:3px;background:linear-gradient(90deg,var(--seq-lo),var(--seq-hi))}
.ramp-l{display:flex;justify-content:space-between;font:14px var(--mono);color:var(--ink-3);margin-top:2px}
.keyrow{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;margin-top:8px}
.keyrow>span{display:inline-flex;gap:6px;align-items:center}
.note-s{font-size:14px;color:var(--ink-3);margin:8px 0 0}
#matrix-root{display:flex;flex-direction:column;gap:16px;margin-bottom:8px}
.tl-legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:15px;color:var(--ink-2);margin:0 0 8px}
.tl-legend>span{display:inline-flex;align-items:center;gap:6px}
.tl-box{width:100%}
.tl-box svg{display:block;width:100%;height:auto;overflow:visible}
.tl-early{fill:var(--surface-2);stroke:var(--line)}
.tl-t{font:13px var(--mono);fill:var(--ink-3)}
.dot{cursor:pointer;outline:none}
.dot:focus-visible .focusring{stroke:var(--focus);stroke-width:3}
.lane{display:flex;flex-direction:column}
.rj{display:grid;gap:8px;padding:12px 0;border-top:1px solid var(--line)}
.rj:first-child{border-top:0;padding-top:2px}
.rj-h{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center}
.ttl{flex:1 1 280px;min-width:0;border:0;background:none;padding:6px 0;text-align:left;cursor:pointer;font-size:17px;color:var(--ink);min-height:44px}
.ttl:hover{text-decoration:underline;text-underline-offset:3px}
.why{margin:0;font-size:16px;color:var(--ink-2)}
.why .rc{display:inline-block;font-size:14px;font-weight:600;color:var(--ink);background:var(--surface-2);border:1px solid var(--line);border-radius:5px;padding:0 8px;margin-right:8px}
.hiddenmsg{font-size:15px;color:var(--ink-3);margin:6px 0 0}
.res{list-style:none;margin:12px 0 0;padding:0}
.rr{padding:10px 8px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:2px;min-width:0}
.rr.on{background:var(--accent-soft);border-radius:8px}
.rr-top{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center}
.rr .ttl{padding:2px 0;min-height:40px}
.res-empty{padding:18px 6px;color:var(--ink-3)}
@media (max-width:1000px){.mx-layout{grid-template-columns:minmax(0,1fr)}}

/* drawer */
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:40}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(620px,100%);background:var(--surface);border-left:1px solid var(--line);box-shadow:var(--pop-shadow);z-index:41;display:flex;flex-direction:column}
.dr-h{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:12px 16px;padding-top:calc(12px + env(safe-area-inset-top,0px));border-bottom:1px solid var(--line)}
.dr-nav{display:flex;gap:8px;align-items:center;font:15px var(--mono);color:var(--ink-3)}
.dr-b{overflow:auto;padding:16px 18px 28px;flex:1}
.dr-b h2{margin:8px 0 12px;font-size:21px;line-height:1.35;font-weight:600}
.dr-badges{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.drawer .dgrid{grid-template-columns:130px minmax(0,1fr)}

/* ---------- trends ---------- */
.tgrid{display:grid;grid-template-columns:minmax(0,1fr);gap:14px}
@media (min-width:820px){.tgrid{grid-template-columns:repeat(2,minmax(0,1fr))}}
.tchart{width:100%}
.gridl{stroke:var(--grid);stroke-width:1}
.axt{font:14px var(--mono);fill:var(--ink-3)}
.axt.cur{fill:var(--ink);font-weight:600}
.axs{font:12px var(--mono);fill:var(--warn)}
.vlab{font:600 14px var(--mono);fill:var(--ink)}
.band-cur{fill:var(--accent-soft)}
.band-cmp{fill:none;stroke:var(--line-strong);stroke-dasharray:4 3}
.tdetails{margin:18px 0 8px}
.tdetails summary{cursor:pointer;min-height:44px;display:flex;align-items:center;font-weight:600;color:var(--accent)}

/* ---------- retro insights ---------- */
.retro{margin:30px 0 0}
.retro-h{align-items:center}
.retro-h h2{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px}
.retro-h-acts{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.retro-copied{margin:0;min-height:1.5em;color:var(--pass);font-weight:600}
.retro-fallback{font-family:var(--mono);font-size:15px;margin:8px 0 14px}
.retro-editbar{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;margin:6px 0 12px}
.retro-editbar .ed-help{margin:0}
.rcards{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:14px;margin:8px 0 14px;align-items:start}
.rcard.open{grid-column:1/-1}
.rcard{--tone:var(--slate);background:var(--surface);border:1px solid var(--line);border-top:4px solid var(--tone);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px 18px;display:flex;flex-direction:column;gap:10px;min-width:0}
.rcard.t-fail{--tone:var(--fail)}.rcard.t-warn{--tone:var(--warn)}.rcard.t-slate{--tone:var(--slate)}.rcard.t-pass{--tone:var(--pass)}
.rbig{margin:0;display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 8px;font-weight:600}
.rbig-n{font:600 36px/1 var(--mono);font-variant-numeric:tabular-nums;color:var(--tone)}
.rbig small{font:500 17px var(--font);color:var(--ink-2)}
.rtext{margin:0;color:var(--ink)}
.raction{margin:0;background:var(--accent-soft);border-radius:8px;padding:10px 12px;font-size:16px}
.rcard-acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:auto}
.showbtn{border-color:var(--accent);color:var(--accent);font-weight:600}
.showbtn[aria-expanded="true"]{background:var(--accent);color:var(--accent-ink)}
.rcard .btn[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);font-weight:600}
.rbugs{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
.rb{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 10px;align-items:start;padding:8px 0;border-bottom:1px solid var(--line)}
.rb .key{padding-top:10px;font-size:15px}
.rb-btn{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 12px;align-items:start;text-align:left;border:0;background:none;border-radius:8px;padding:6px 8px;min-height:44px;cursor:pointer;min-width:0;width:100%}
.rb-btn .tags{flex-wrap:nowrap;padding-top:2px}
@media (max-width:640px){.rb-btn{grid-template-columns:minmax(0,1fr)}.rb-btn .tags{flex-wrap:wrap}}
.rb-btn:hover{background:var(--surface-2)}
.rb-btn .title{font-size:16px}
.rb.missing{grid-template-columns:auto 1fr;align-items:center;padding:12px 0}
.r-tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding-top:8px;border-top:1px dashed var(--line)}
.r-form{max-width:none}
.r-form-row{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,2fr);gap:12px}
.rcard-form{grid-column:1/-1}
.ssc-h{font-size:19px;margin:18px 0 10px;font-weight:600}
.ssc{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,230px),1fr));gap:14px}
.ssc-col{background:var(--surface-2);border:1px solid var(--line);border-radius:var(--radius);padding:16px;min-width:0;display:flex;flex-direction:column;gap:10px}
.ssc-col h3{margin:0;font:600 14px var(--mono);letter-spacing:.1em;text-transform:uppercase;display:flex;align-items:center;gap:8px}
.ssc-col h3::before{content:"";width:12px;height:12px;border-radius:3px;background:currentColor}
.ssc-col.c-start h3{color:var(--accent)}.ssc-col.c-stop h3{color:var(--fail)}.ssc-col.c-continue h3{color:var(--pass)}.ssc-col.c-watch h3{color:var(--warn)}
.ssc-col ul{margin:0;padding-left:1.1em;display:grid;gap:12px}
.ssc-col li b{display:block}
.ssc-col li span{color:var(--ink-2);font-size:16px}
.ssc-col li .r-tools,.ssc-col li .ed-confirm{margin-top:6px}
.ssc-col .ssc-form-li{list-style:none;margin-left:-1.1em}
.small-form{padding:12px}
@media (max-width:600px){.r-form-row{grid-template-columns:minmax(0,1fr)}}

footer.method{border-top:1px solid var(--line);margin-top:34px;padding-block:22px 48px;font-size:16px;color:var(--ink-2)}
footer.method h2{font-size:18px;margin:0 0 8px;color:var(--ink)}
footer.method p{margin:6px 0;max-width:86ch}
footer.method code{font-size:14px;background:var(--surface-2);padding:1px 5px;border-radius:4px;overflow-wrap:anywhere}

/* tooltip */
.tt{position:fixed;z-index:60;pointer-events:none;background:var(--surface);color:var(--ink);border:1px solid var(--line-strong);border-radius:10px;padding:8px 12px;font-size:15px;box-shadow:var(--pop-shadow);max-width:320px}
.tt .v{font:600 17px var(--mono);display:flex;align-items:center;gap:8px}
.tt .key-sw{display:inline-block;width:14px;height:4px;border-radius:2px}
.tt .l{color:var(--ink-2)}
.tt .h{color:var(--ink-3);font-size:14px;margin-top:3px}

@media (max-width:760px){
  .card-head{grid-template-columns:minmax(0,1fr);padding:18px 16px 14px}
  .bug-line{grid-template-columns:minmax(0,1fr);padding:0 10px 0 16px}
  .bug-line .key{padding:12px 0 0}
  .bug-toggle{grid-template-columns:minmax(0,1fr) 20px;padding:4px 4px 12px 0}

  .bug-toggle .chev{grid-column:2;grid-row:1}
  .bug-detail{padding:2px 16px 18px}
  .dgrid,.drawer .dgrid{grid-template-columns:minmax(0,1fr);gap:2px}
  .dgrid dd{margin-bottom:10px}
  .group-h{padding:12px 16px 6px}
  .tbl tr.detail td{padding-left:14px}
  .drawer{top:auto;left:0;width:100%;max-height:90vh;border-left:0;border-top:1px solid var(--line);border-radius:16px 16px 0 0}
  .lb-btn{min-width:0}

  table.mx{min-width:0}
  .mx td.rowh{min-width:110px}
  .cell{min-width:44px}
  .tot{min-width:0}.tot .mini{display:none}
}
